<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Training Log">
<meta name="theme-color" content="#f2ede2">
<title>My Training Log</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --ink: #211f1a; --paper: #f2ede2; --paper-2: #fffdf8; --line: #ddd5c2;
    --sage: #5c6b47; --sage-dark: #3f4a31; --rust: #b5562f; --muted: #8c8574;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(22px + env(safe-area-inset-top, 0px)) 16px calc(60px + env(safe-area-inset-bottom, 0px)); }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .save-state { font-size: 12px; color: var(--muted); }
  .day-tabs { display: flex; gap: 8px; margin: 18px 0 10px; overflow-x: auto; padding-bottom: 2px; }
  .day-tab {
    flex: 0 0 auto; padding: 10px 16px; text-align: center; white-space: nowrap;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper-2);
    font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer;
  }
  .day-tab.active { border-color: var(--sage-dark); background: var(--sage-dark); color: #fdfbf6; }
  .day-tab.add { color: var(--sage-text); border-style: dashed; }
  .day-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .day-name-input {
    flex: 1; font-size: 18px; font-weight: 700; border: none; border-bottom: 1.5px dashed var(--line);
    background: transparent; color: var(--ink); padding: 4px 0;
  }
  .day-name-input:focus { outline: none; border-bottom-color: var(--sage-text); }
  .icon-btn {
    font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--rust); color: var(--rust); background: transparent;
  }
  .slot {
    background: color-mix(in srgb, color-mix(in srgb, var(--paper-2) 80%, var(--tint-color, var(--paper-2)) 20%) var(--card-bg-pct, 100%), transparent);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 14px 12px; margin-bottom: 14px;
    box-shadow: var(--card-shadow, 0 1px 3px rgba(33,31,26,0.08));
  }
  .slot-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .ex-row { display: flex; align-items: center; gap: 6px; flex: 1; }
  .ex-input {
    width: 100%; border: none; border-bottom: 1.5px dashed var(--line);
    background: transparent; font-size: 16px; font-weight: 700; padding: 2px 0 4px; color: var(--ink);
  }
  .ex-input:focus { outline: none; border-bottom-color: var(--sage-text); }
  .ex-input::placeholder { color: #c2bba6; font-weight: 600; }
  .demo-btn, .remove-btn {
    width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 700; line-height: 16px;
    text-align: center; cursor: pointer; background: transparent; padding: 0; flex-shrink: 0; border: 1px solid;
  }
  .demo-btn { border-color: var(--sage-text); color: var(--sage-text); font-size: 8px; }
  .remove-btn { border-color: var(--rust); color: var(--rust); }
  .target-row { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .target { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .sets-stepper { display: flex; align-items: center; gap: 6px; }
  .sets-stepper button {
    width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 700; line-height: 1; cursor: pointer; padding: 0;
  }
  .sets-stepper span { font-size: 12px; font-weight: 700; color: var(--sage-text); min-width: 34px; text-align: center; }
  .client-block { margin-top: 10px; }
  .client-row { display: flex; align-items: center; gap: 6px; }
  .client-name {
    font-size: 16px; font-weight: 700; color: var(--sage-text); border: none; background: transparent;
    padding: 2px 0; flex: 1;
  }
  .client-name:focus { outline: none; }
  table.set-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  table.set-table th {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    text-align: center; font-weight: 700; padding: 2px 2px 4px;
  }
  table.set-table th:first-child { text-align: left; width: 34px; }
  table.set-table td { padding: 2px 2px; text-align: center; }
  table.set-table td:first-child { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); }
  table.set-table input[type=number] {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
    color: var(--ink); text-align: center; font-size: 16px; padding: 5px 2px; -moz-appearance: textfield;
  }
  table.set-table input[type=number]::-webkit-inner-spin-button,
  table.set-table input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  table.set-table input:focus { outline: none; border-color: var(--sage-text); }
  .rir-select {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
    color: var(--ink); font-size: 16px; padding: 5px 0;
    -webkit-appearance: none; appearance: none;
    text-align: center; text-align-last: center; text-indent: 0;
  }
  .add-exercise-btn {
    width: 100%; padding: 12px 0; border-radius: 10px; border: 1.5px dashed var(--line);
    background: transparent; color: var(--sage-text); font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 14px;
  }
  .toolbar { display: flex; gap: 10px; margin-top: 14px; }
  .toolbar button {
    flex: 1; padding: 12px 0; border-radius: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--paper-2); color: var(--ink);
  }
  .toolbar button.primary { background: var(--rust); border-color: var(--rust); color: #fff; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .guide-term { margin-bottom: 12px; }
  .guide-term-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .guide-term-def { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .archive-set-line { font-size: 12.5px; margin-bottom: 3px; }
  .archive-client-name { font-size: 16px; font-weight: 700; color: var(--sage-text); margin-top: 6px; }
  .style-row { margin-bottom: 16px; }
  .style-row-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .swatch-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; padding: 0; }
  .swatch.selected { border-color: var(--ink); }
  .choice-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .choice-btn {
    padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper);
    color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .choice-btn.selected { border-color: var(--sage-dark); background: var(--sage-dark); color: #fdfbf6; }
  .tint-btn {
    width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted);
    font-size: 9px; line-height: 14px; text-align: center; cursor: pointer; background: transparent; padding: 0; flex-shrink: 0;
  }
  .tint-row { display: none; gap: 8px; margin: 8px 0 4px; align-items: center; }
  .tint-row.show { display: flex; }
  .tint-swatch { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; padding: 0; }
  .tint-swatch.selected { border-color: var(--ink); }
  .tint-clear { font-size: 16px; color: var(--muted); cursor: pointer; background: none; border: none; padding: 0 2px; line-height: 1; }
  .opacity-slider-row { display: flex; align-items: center; gap: 10px; }
  .opacity-slider-row input[type=range] { flex: 1; accent-color: var(--sage-text); }
  .opacity-slider-row span { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 34px; text-align: right; }
  .uni-toggle {
    font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--muted); margin-top: 2px;
  }
  .uni-toggle.active { border-color: var(--sage-dark); background: var(--sage-dark); color: #fdfbf6; }
  .side-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
    color: var(--muted); margin-top: 8px; margin-bottom: 2px;
  }
  #editBanner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: color-mix(in srgb, var(--rust) 15%, var(--paper-2)); border: 1px solid var(--rust);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px; color: var(--ink);
  }
  #editBanner button {
    font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--rust); background: transparent; color: var(--rust); flex-shrink: 0;
  }
  .bg-url-row { display: flex; gap: 8px; }
  .bg-url-row input[type=text] {
    flex: 1; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper);
    color: var(--ink); font-size: 13px; padding: 8px 10px;
  }
  .bg-url-row button {
    padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--sage-dark);
    background: var(--sage-dark); color: #fdfbf6; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  #bgLayer {
    position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center;
    background-color: var(--paper); background-blend-mode: overlay;
    opacity: var(--bg-opacity, 0.32); pointer-events: none; transition: opacity 0.2s ease;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
    background: var(--sage-dark); color: #fff; font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div class="wrap">
  <div class="top">
    <h1>My Training Log</h1>
    <span class="save-state" id="saveState">loading…</span>
  </div>

  <div class="day-tabs" id="dayTabs"></div>
  <div class="day-head-row">
    <input class="day-name-input" id="dayNameInput" placeholder="Day name">
    <button class="icon-btn" onclick="deleteCurrentDay()">Delete day</button>
  </div>

  <div id="slots"></div>
  <button class="add-exercise-btn" onclick="addExercise()">+ Add exercise</button>

  <div id="editBanner" style="display:none;"></div>

  <div class="toolbar">
    <button onclick="addClient()">+ Add person</button>
    <button class="primary" onclick="saveToArchive()">Save to archive</button>
  </div>
  <div class="toolbar">
    <button onclick="newSession()">Clear numbers</button>
    <button onclick="toggleArchiveView()" id="archiveToggle">View archive</button>
    <button onclick="toggleGuide()" id="guideToggle">Guide</button>
  </div>
  <div class="toolbar">
    <button onclick="toggleStyle()" id="styleToggle">Customize look</button>
  </div>

  <div id="archiveView" style="display:none;"></div>
  <div id="guideView" style="display:none;"></div>
  <div id="styleView" style="display:none;"></div>

  <p class="hint">Tap the "+" tab to add a new day, or "Delete day" to remove the one you're on. Each exercise has its own +/- for set count, with weight, reps, and RIR tracked separately per set.</p>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- Same Firebase project as the main tracker, kept in its own separate space via the key prefix below. ----
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyD_tmxXDYlzx3_legMEsGytJt25YrPBK0s',
  authDomain: 'live-gym-backend.firebaseapp.com',
  projectId: 'live-gym-backend',
  storageBucket: 'live-gym-backend.firebasestorage.app',
  messagingSenderId: '385571173926',
  appId: '1:385571173926:web:b7f58cc735bdf86c9ad8e7'
};
const KEY_PREFIX = 'carlos-';
// -----------------------------------------------------------------------------------------------------------

const hasNativeStorage = typeof window !== 'undefined' && !!window.storage;
let firestoreDb = null;
let lastKnownStateJSON = null;
let firestoreEnabled = false;

function tryInitFirestore() {
  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId) return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    firestoreDb = firebase.firestore();
    firestoreEnabled = true;
  } catch (e) { firestoreEnabled = false; }
}

async function storageGet(key, shared) {
  if (firestoreEnabled) {
    try {
      const doc = await firestoreDb.collection('tracker-store').doc(KEY_PREFIX + key).get();
      return doc.exists ? { value: doc.data().value } : null;
    } catch (e) { return null; }
  }
  if (hasNativeStorage) {
    try { return await window.storage.get(KEY_PREFIX + key, shared); } catch (e) { return null; }
  }
  try {
    const raw = localStorage.getItem(KEY_PREFIX + key);
    return raw ? { value: raw } : null;
  } catch (e) { return null; }
}

async function storageSet(key, value, shared) {
  if (firestoreEnabled) {
    try {
      await firestoreDb.collection('tracker-store').doc(KEY_PREFIX + key).set({ value: value });
      return { value };
    } catch (e) { return null; }
  }
  if (hasNativeStorage) {
    try { return await window.storage.set(KEY_PREFIX + key, value, shared); } catch (e) { return null; }
  }
  try {
    localStorage.setItem(KEY_PREFIX + key, value);
    return { value };
  } catch (e) { return null; }
}

function subscribeLiveUpdates() {
  if (!firestoreEnabled) return;
  firestoreDb.collection('tracker-store').doc(KEY_PREFIX + 'workout-tracker-state').onSnapshot(doc => {
    if (!doc.exists) return;
    const incoming = doc.data().value;
    if (incoming === lastKnownStateJSON) return;
    lastKnownStateJSON = incoming;
    state = JSON.parse(incoming);
    render();
    setSaveState('synced (live update)');
  });
}

function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

const GLOSSARY = [
  { term: 'RIR — reps in reserve', def: 'How many more reps you could still do before hitting failure. RIR 2 means you stopped 2 reps short of your max for that set.' },
  { term: 'Working set', def: 'A set that counts toward your target — not a warm-up or a ramp-up set.' },
  { term: 'Adding and removing days', def: 'Tap the "+" tab to add a day, rename it right below the tabs, or "Delete day" to remove the one you\'re currently on.' }
];

const ACCENT_SWATCHES = [
  { name: 'Rust', value: '#b5562f' }, { name: 'Teal', value: '#2f7a6e' }, { name: 'Plum', value: '#7a4a8a' },
  { name: 'Mustard', value: '#a8791f' }, { name: 'Slate', value: '#4a5a8a' }, { name: 'Crimson', value: '#a13a3a' }
];
const FONT_CHOICES = [
  { name: 'System', value: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" },
  { name: 'Serif', value: "Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" },
  { name: 'Rounded', value: "ui-rounded, 'SF Pro Rounded', 'Segoe UI', sans-serif" }
];
const LIGHT_PALETTE = { ink: '#211f1a', paper: '#f2ede2', paper2: '#fffdf8', line: '#ddd5c2', muted: '#8c8574', sageText: '#3f4a31' };
const DARK_PALETTE = { ink: '#f4efe2', paper: '#16180f', paper2: '#282b21', line: '#454a3a', muted: '#aca795', sageText: '#a3c47f' };

function defaultTheme() {
  return { accent: '#b5562f', mode: 'light', font: FONT_CHOICES[0].value, backgroundImage: '', cardTints: {}, cardOpacity: 1, textAccent: '', collapsedCards: {} };
}
let localTheme = defaultTheme();
function loadLocalTheme() {
  try {
    const raw = localStorage.getItem('training-log-theme-local');
    if (raw) localTheme = Object.assign(defaultTheme(), JSON.parse(raw));
  } catch (e) { localTheme = defaultTheme(); }
}
function saveLocalTheme() {
  try { localStorage.setItem('training-log-theme-local', JSON.stringify(localTheme)); } catch (e) {}
}

function toggleCardTint(rowId) {
  document.getElementById(rowId).classList.toggle('show');
}

function setCardTint(exId, color) {
  if (!localTheme.cardTints) localTheme.cardTints = {};
  if (color) localTheme.cardTints[exId] = color; else delete localTheme.cardTints[exId];
  saveLocalTheme();
  render();
}

function toggleCardCollapse(exId) {
  if (!localTheme.collapsedCards) localTheme.collapsedCards = {};
  localTheme.collapsedCards[exId] = !localTheme.collapsedCards[exId];
  saveLocalTheme();
  render();
}

function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function defaultState() {
  const dayIds = [newId(), newId(), newId()];
  return {
    currentDayId: dayIds[0],
    clients: ['Me'],
    days: [
      { id: dayIds[0], label: 'Day 1', exercises: [{ id: newId(), name: '', sets: 3 }] },
      { id: dayIds[1], label: 'Day 2', exercises: [{ id: newId(), name: '', sets: 3 }] },
      { id: dayIds[2], label: 'Day 3', exercises: [{ id: newId(), name: '', sets: 3 }] }
    ],
    logs: {}
  };
}

let state = null;
let saveTimeout = null;
let archiveVisible = false;
let guideVisible = false;
let currentArchiveList = [];

function emptySetEntry() { return { weight: '', reps: '', rir: '' }; }
function logKey(dayId, exId, clientIdx, side) { return dayId + '-' + exId + '-' + clientIdx + (side ? '-' + side : ''); }

function currentDay() {
  return state.days.find(d => d.id === state.currentDayId) || state.days[0];
}

function getLog(dayId, exId, targetSets, clientIdx, side) {
  const key = logKey(dayId, exId, clientIdx, side);
  if (!state.logs[key] || !Array.isArray(state.logs[key].entries)) state.logs[key] = { entries: [] };
  const log = state.logs[key];
  while (log.entries.length < targetSets) log.entries.push(emptySetEntry());
  if (log.entries.length > targetSets) log.entries = log.entries.slice(0, targetSets);
  return log;
}

async function loadState() {
  tryInitFirestore();
  const result = await storageGet('workout-tracker-state', true);
  if (result) {
    lastKnownStateJSON = result.value;
    state = JSON.parse(result.value);
  } else {
    state = defaultState();
  }
  loadLocalTheme();
  applyTheme();
  render();
  setSaveState(firestoreEnabled ? 'synced (live)' : 'synced (this device)');
  subscribeLiveUpdates();
}

function scheduleSave() {
  setSaveState('saving…');
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    const json = JSON.stringify(state);
    lastKnownStateJSON = json;
    const result = await storageSet('workout-tracker-state', json, true);
    setSaveState(result ? (firestoreEnabled ? 'synced (live)' : 'synced (this device)') : 'save failed');
  }, 500);
}

function setSaveState(text) { document.getElementById('saveState').textContent = text; }

function switchDay(dayId) {
  state.currentDayId = dayId;
  render();
  scheduleSave();
}

function addDay() {
  const day = { id: newId(), label: 'New day', exercises: [{ id: newId(), name: '', sets: 3 }] };
  state.days.push(day);
  state.currentDayId = day.id;
  render();
  scheduleSave();
}

function renameCurrentDay(value) {
  currentDay().label = value;
  renderDayTabs();
  scheduleSave();
}

function deleteCurrentDay() {
  if (state.days.length <= 1) { showToast("Can't delete your only day"); return; }
  if (!confirm('Delete "' + currentDay().label + '"? This removes its logged numbers too.')) return;
  const dayId = state.currentDayId;
  state.days = state.days.filter(d => d.id !== dayId);
  Object.keys(state.logs).forEach(k => { if (k.startsWith(dayId + '-')) delete state.logs[k]; });
  state.currentDayId = state.days[0].id;
  render();
  scheduleSave();
}

function addExercise() {
  currentDay().exercises.push({ id: newId(), name: '', sets: 3 });
  render();
  scheduleSave();
}

function removeExercise(exId) {
  if (!confirm('Remove this exercise?')) return;
  const day = currentDay();
  day.exercises = day.exercises.filter(e => e.id !== exId);
  Object.keys(state.logs).forEach(k => { if (k.startsWith(day.id + '-' + exId + '-')) delete state.logs[k]; });
  render();
  scheduleSave();
}

function addClient() {
  const n = state.clients.length + 1;
  state.clients.push('Person ' + n);
  render();
  scheduleSave();
}

function updateExerciseName(exId, value) {
  const ex = currentDay().exercises.find(e => e.id === exId);
  ex.name = value;
  scheduleSave();
}

function updateSets(exId, delta) {
  const ex = currentDay().exercises.find(e => e.id === exId);
  ex.sets = Math.max(1, Math.min(8, (ex.sets || 3) + delta));
  render();
  scheduleSave();
}

function toggleUnilateral(exId) {
  const ex = currentDay().exercises.find(e => e.id === exId);
  ex.unilateral = !ex.unilateral;
  render();
  scheduleSave();
}

function updateSetField(exId, clientIdx, setIdx, field, value, side) {
  const day = currentDay();
  const ex = day.exercises.find(e => e.id === exId);
  const log = getLog(day.id, exId, ex.sets, clientIdx, side);
  log.entries[setIdx][field] = value;
  scheduleSave();
}

function newSession() {
  state.logs = {};
  render();
  scheduleSave();
}

function buildRirPicker(currentValue, onChange) {

let editingArchiveEntry = null;

async function saveToArchive() {
  const day = editingArchiveEntry
    ? (state.days.find(d => d.id === editingArchiveEntry.dayId) || currentDay())
    : currentDay();
  const freshExercises = JSON.parse(JSON.stringify(day.exercises));
  const freshLogs = JSON.parse(JSON.stringify(state.logs));
  const freshClients = JSON.parse(JSON.stringify(state.clients));

  const existing = await storageGet('workout-tracker-archive', true);
  const list = existing ? JSON.parse(existing.value) : [];

  if (editingArchiveEntry) {
    const idx = list.findIndex(e => e.timestamp === editingArchiveEntry.timestamp);
    const updated = {
      date: editingArchiveEntry.date, timestamp: editingArchiveEntry.timestamp,
      dayId: day.id, dayLabel: day.label,
      clients: freshClients, exercises: freshExercises, logs: freshLogs
    };
    if (idx >= 0) list[idx] = updated; else list.unshift(updated);
    const result = await storageSet('workout-tracker-archive', JSON.stringify(list), true);
    showToast(result ? 'Entry updated ✓ (kept ' + editingArchiveEntry.date + ')' : 'Could not save — try again');
    if (result) { editingArchiveEntry = null; updateEditBanner(); }
    return;
  }

  const today = new Date();
  const dateLabel = today.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const entry = {
    date: dateLabel, timestamp: today.getTime(), dayId: day.id, dayLabel: day.label,
    clients: freshClients, exercises: freshExercises, logs: freshLogs
  };
  list.unshift(entry);
  const result = await storageSet('workout-tracker-archive', JSON.stringify(list), true);
  showToast(result ? 'Session saved to archive ✓' : 'Could not save — try again');
}

function updateEditBanner() {
  const banner = document.getElementById('editBanner');
  if (editingArchiveEntry) {
    banner.innerHTML = '';
    banner.style.display = 'flex';
    const span = document.createElement('span');
    span.textContent = 'Editing ' + editingArchiveEntry.date + ' — saving will update that entry';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', cancelEditingArchive);
    banner.appendChild(span);
    banner.appendChild(cancelBtn);
  } else {
    banner.style.display = 'none';
    banner.innerHTML = '';
  }
}

function cancelEditingArchive() {
  editingArchiveEntry = null;
  updateEditBanner();

}

async function toggleArchiveView() {

  const el = document.getElementById('archiveView');
  archiveVisible = !archiveVisible;

  currentArchiveList = result ? JSON.parse(result.value) : [];

async function deleteArchiveEntry(timestamp) {
  if (!confirm("Delete this archived session? This can't be undone.")) return;
  currentArchiveList = currentArchiveList.filter(e => e.timestamp !== timestamp);
  const result = await storageSet('workout-tracker-archive', JSON.stringify(currentArchiveList), true);
  showToast(result ? 'Session deleted' : 'Could not delete — try again');
  if (result) renderArchive(currentArchiveList);
}

function editArchiveEntry(timestamp) {
  const entry = currentArchiveList.find(e => e.timestamp === timestamp);
  if (!entry) return;
  let day = state.days.find(d => d.id === entry.dayId);
  if (!day) {
    day = { id: entry.dayId, label: entry.dayLabel, exercises: [] };
    state.days.push(day);
  }
  day.exercises = JSON.parse(JSON.stringify(entry.exercises));
  Object.keys(entry.logs).forEach(k => {
    state.logs[k] = JSON.parse(JSON.stringify(entry.logs[k]));
  });
  state.currentDayId = day.id;
  editingArchiveEntry = { timestamp: entry.timestamp, date: entry.date, dayId: day.id };
  archiveVisible = true;
  toggleArchiveView();
  render();
  scheduleSave();
  updateEditBanner();
  window.scrollTo(0, 0);
  showToast('Loaded ' + entry.date + ' for editing');
}

          const parts = entries.map((e, i) => (e.weight || e.reps || e.rir) ? ('Set ' + (i + 1) + ': ' + (e.weight || '?') + ' x ' + (e.reps || '?') + ' @RIR ' + (e.rir || '?')) : null).filter(Boolean);

function applyTheme() {
  const t = localTheme;
  const palette = t.mode === 'dark' ? DARK_PALETTE : LIGHT_PALETTE;
  const root = document.documentElement.style;
  root.setProperty('--rust', t.accent);
  root.setProperty('--ink', palette.ink);
  root.setProperty('--paper', palette.paper);
  root.setProperty('--paper-2', palette.paper2);
  root.setProperty('--line', palette.line);
  root.setProperty('--muted', palette.muted);
  root.setProperty('--sage-text', t.textAccent || palette.sageText);
  root.setProperty('--card-bg-pct', Math.round((t.cardOpacity != null ? t.cardOpacity : 1) * 100) + '%');
  root.setProperty('--bg-opacity', t.mode === 'dark' ? '0.14' : '0.32');
  root.setProperty('--card-shadow', t.mode === 'dark'
    ? '0 2px 10px rgba(0,0,0,0.5)'
    : '0 1px 3px rgba(33,31,26,0.08), 0 1px 2px rgba(33,31,26,0.05)');
  document.body.style.fontFamily = t.font;
  const bgLayer = document.getElementById('bgLayer');
  bgLayer.style.backgroundImage = t.backgroundImage ? 'url(' + JSON.stringify(t.backgroundImage) + ')' : 'none';
}
function setAccent(value) { localTheme.accent = value; applyTheme(); renderStyle(); saveLocalTheme(); }
function setMode(value) { localTheme.mode = value; applyTheme(); renderStyle(); saveLocalTheme(); }
function setFont(value) { localTheme.font = value; applyTheme(); renderStyle(); saveLocalTheme(); }
function setCardOpacity(value) { localTheme.cardOpacity = parseFloat(value); applyTheme(); saveLocalTheme(); }
function setTextAccent(value) { localTheme.textAccent = value; applyTheme(); renderStyle(); saveLocalTheme(); }
function setBackgroundImage() {
  const input = document.getElementById('bgImageInput');
  const url = input.value.trim();
  if (!url) {
    localTheme.backgroundImage = '';
    applyTheme();
    saveLocalTheme();
    showToast('Background image cleared');
    return;
  }
  showToast('Checking image…');
  const tester = new Image();
  tester.onload = () => {
    localTheme.backgroundImage = url;
    applyTheme();
    saveLocalTheme();
    showToast('Background image set ✓');
  };
  tester.onerror = () => {
    showToast("That image didn't load — check the link or try hosting it in this repo");
  };
  tester.src = url;
}
function clearBackgroundImage() {
  localTheme.backgroundImage = '';
  document.getElementById('bgImageInput').value = '';

}

        scheduleSave();
      });
      block.appendChild(nameInput);

      if (ex.unilateral) {
        block.appendChild(buildSetTable(clientIdx, 'L', 'Left'));
        block.appendChild(buildSetTable(clientIdx, 'R', 'Right'));
      } else {
        block.appendChild(buildSetTable(clientIdx, null, null));
      }

      body.appendChild(block);
    });

    div.appendChild(body);
    container.appendChild(div);
  });
}

document.getElementById('dayNameInput').addEventListener('input', (e) => renameCurrentDay(e.target.value));

loadState();
</script>
</body>
</html>
